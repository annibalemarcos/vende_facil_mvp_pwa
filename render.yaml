services:
  - type: web
    name: vende-facil
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: VENDE_FACIL_SECRET
        generateValue: true
      - key: VENDE_FACIL_LOGIN_EMAIL
        value: admin@vendefacil.com
      - key: VENDE_FACIL_LOGIN_PASSWORD
        sync: false
      - key: VENDE_FACIL_DATA_DIR
        value: /opt/render/project/src/data
      - key: DATABASE_URL
        fromDatabase:
          name: vende-facil-db
          property: connectionString

databases:
  - name: vende-facil-db
    plan: free
