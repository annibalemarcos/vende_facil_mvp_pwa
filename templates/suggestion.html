{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8">
    <div class="vf-card rounded-5 p-4 p-md-5">
      <h1 class="h2 fw-black mb-2">✨ Texto melhor para anúncio</h1>
      <p class="text-muted">Geração simples local, sem API. Já deixa menos robótico e mais vendável.</p>
      <h2 class="h5 mt-4">{{ product.title }}</h2>
      <textarea id="suggestedText" class="form-control rounded-4" rows="10">{{ suggested }}</textarea>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-vf rounded-pill" data-copy-target="suggestedText">Copiar texto</button>
        <a class="btn btn-light rounded-pill" href="{{ url_for('product_edit', product_id=product.id) }}">Editar produto</a>
        <a class="btn btn-outline-dark rounded-pill" href="{{ url_for('products') }}">Voltar</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
